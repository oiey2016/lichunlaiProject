<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极限跑酷 - Endless Runner</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="score-board">
                <div class="score-item">
                    <span class="label">分数</span>
                    <span class="value" id="score">0</span>
                </div>
                <div class="score-item">
                    <span class="label">金币</span>
                    <span class="value" id="coins">0</span>
                </div>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div class="game-overlay" id="startScreen">
            <div class="overlay-content">
                <h1 class="game-title">🏃 极限跑酷</h1>
                <p class="game-subtitle">躲避障碍，收集金币，挑战最高分！</p>
                <div class="controls-info">
                    <div class="control-key">← →</div>
                    <span>左右移动</span>
                    <div class="control-key">↑</div>
                    <span>跳跃</span>
                    <div class="control-key">↓</div>
                    <span>滑行</span>
                </div>
                <button class="start-btn" id="startBtn">开始游戏</button>
            </div>
        </div>
        
        <div class="game-overlay hidden" id="gameOverScreen">
            <div class="overlay-content">
                <h2 class="game-over-title">游戏结束</h2>
                <div class="final-stats">
                    <div class="stat-item">
                        <span class="stat-label">最终分数</span>
                        <span class="stat-value" id="finalScore">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">收集金币</span>
                        <span class="stat-value" id="finalCoins">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">最高记录</span>
                        <span class="stat-value" id="highScore">0</span>
                    </div>
                </div>
                <button class="start-btn" id="restartBtn">再来一局</button>
            </div>
        </div>
    </div>
    
    <script src="js/game.js"></script>
</body>
</html>
