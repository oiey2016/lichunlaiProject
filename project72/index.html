<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打砖块 - Brick Breaker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🎮 打砖块</h1>
            <div class="stats">
                <div class="stat">
                    <span>分数</span>
                    <span id="score">0</span>
                </div>
                <div class="stat">
                    <span>生命</span>
                    <span id="lives">3</span>
                </div>
                <div class="stat">
                    <span>关卡</span>
                    <span id="level">1</span>
                </div>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="game-controls">
            <button id="pauseBtn" class="btn btn-secondary">暂停</button>
            <button id="resetBtn" class="btn btn-danger">重置</button>
        </div>
        
        <div class="game-info">
            <h3>🎯 游戏规则</h3>
            <ul>
                <li>使用 ← → 方向键、A/D 按键或鼠标移动挡板</li>
                <li>反弹小球消除所有砖块即可过关</li>
                <li>消除不同颜色砖块获得不同分数</li>
                <li>小球掉落会损失一条生命</li>
                <li>生命归零游戏结束</li>
            </ul>
        </div>
        
        <div id="gameOverlay" class="overlay">
            <div class="overlay-content">
                <h2 id="overlayTitle">准备好了吗？</h2>
                <p id="overlayMessage">按空格键或点击下方按钮开始挑战！</p>
                <button id="overlayStartBtn" class="btn btn-primary">开始游戏</button>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
