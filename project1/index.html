<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国象棋</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>中国象棋</h1>
            <div class="game-info">
                <div class="current-player">当前玩家：<span id="current-player">红方</span></div>
                <div class="game-status" id="game-status">游戏进行中</div>
            </div>
        </div>
        
        <div class="board-wrapper">
            <div class="board" id="board"></div>
        </div>
        
        <div class="game-controls">
            <button id="reset-btn" class="btn">重新开始</button>
            <button id="undo-btn" class="btn">悔棋</button>
            <button id="hint-btn" class="btn">提示</button>
        </div>
        
        <div class="game-history">
            <h3>棋谱记录</h3>
            <div id="move-history" class="history-list"></div>
        </div>
    </div>
    
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">游戏结束</h2>
            <p id="modal-message"></p>
            <button id="modal-btn" class="btn">确定</button>
        </div>
    </div>
    
    <script src="js/board.js"></script>
    <script src="js/piece.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
