<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点点连线 - 益智消除游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1 class="game-title">🎯 点点连线</h1>
            <div class="game-stats">
                <div class="stat-box">
                    <span class="stat-label">关卡</span>
                    <span class="stat-value" id="level">1</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">分数</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">剩余步数</span>
                    <span class="stat-value" id="moves">30</span>
                </div>
            </div>
        </header>

        <div class="goal-panel">
            <div class="goal-title">🎯 关卡目标</div>
            <div class="goals" id="goals"></div>
        </div>

        <div class="game-board-container">
            <canvas id="gameCanvas" width="500" height="500"></canvas>
            <svg id="lineSvg" class="line-svg" width="500" height="500"></svg>
        </div>

        <div class="game-controls">
            <button id="restartBtn" class="btn btn-secondary">🔄 重新开始</button>
            <button id="rulesBtn" class="btn btn-info">📖 游戏规则</button>
            <button id="hintBtn" class="btn btn-primary">💡 提示</button>
        </div>
    </div>

    <div id="rulesModal" class="modal hidden">
        <div class="modal-content rules-content">
            <h2>📖 游戏规则</h2>
            <div class="rules-list">
                <div class="rule-item">
                    <span class="rule-icon">🎯</span>
                    <div class="rule-text">
                        <strong>连接同色点</strong>
                        <p>用鼠标或手指滑动，连接相邻的同色圆点（可斜向连接）</p>
                    </div>
                </div>
                <div class="rule-item">
                    <span class="rule-icon">✨</span>
                    <div class="rule-text">
                        <strong>消除得分</strong>
                        <p>连接2个以上同色点即可消除，连接越长，得分越高！</p>
                    </div>
                </div>
                <div class="rule-item">
                    <span class="rule-icon">🏆</span>
                    <div class="rule-text">
                        <strong>完成目标</strong>
                        <p>在限定步数内，消除指定数量的各色圆点即可过关</p>
                    </div>
                </div>
                <div class="rule-item">
                    <span class="rule-icon">💡</span>
                    <div class="rule-text">
                        <strong>连击技巧</strong>
                        <p>尽量一次连接更多的同色点，获得更高的分数加成！</p>
                    </div>
                </div>
            </div>
            <button id="closeRulesBtn" class="btn btn-primary">知道了！</button>
        </div>
    </div>

    <div id="winModal" class="modal hidden">
        <div class="modal-content">
            <h2>🎉 恭喜过关！</h2>
            <p class="modal-score">得分: <span id="finalScore">0</span></p>
            <button id="nextLevelBtn" class="btn btn-primary">下一关 ▶</button>
        </div>
    </div>

    <div id="loseModal" class="modal hidden">
        <div class="modal-content">
            <h2>😢 步数用完了</h2>
            <p class="modal-score">得分: <span id="loseScore">0</span></p>
            <button id="retryBtn" class="btn btn-primary">🔄 再试一次</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
