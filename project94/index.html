<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞刀挑战</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="score-board">
                <span class="label">分数</span>
                <span class="value" id="score">0</span>
            </div>
            <div class="level-board">
                <span class="label">关卡</span>
                <span class="value" id="level">1</span>
            </div>
            <div class="knives-board">
                <span class="label">剩余飞刀</span>
                <span class="value" id="knives-left">8</span>
            </div>
        </div>

        <canvas id="gameCanvas" width="600" height="550"></canvas>

        <div class="game-controls" id="gameControls">
            <button class="control-btn" id="homeBtn">🏠 返回首页</button>
            <button class="control-btn" id="resetBtn">🔄 重新开始</button>
        </div>

        <div class="game-overlay" id="startScreen">
            <div class="overlay-content">
                <h1>🎯 飞刀挑战</h1>
                <p>点击屏幕投掷飞刀</p>
                <p>不要扎到已有的飞刀！</p>
                <button class="btn" id="startBtn">开始游戏</button>
            </div>
        </div>

        <div class="game-overlay hidden" id="gameOverScreen">
            <div class="overlay-content">
                <h1>💥 游戏结束</h1>
                <p>最终分数: <span id="finalScore">0</span></p>
                <p>到达关卡: <span id="finalLevel">1</span></p>
                <button class="btn" id="restartBtn">重新开始</button>
            </div>
        </div>

        <div class="game-overlay hidden" id="levelCompleteScreen">
            <div class="overlay-content">
                <h1>🎉 关卡完成！</h1>
                <p>准备进入第 <span id="nextLevel">2</span> 关</p>
                <button class="btn" id="nextLevelBtn">继续</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
