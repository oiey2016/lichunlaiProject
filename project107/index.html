<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狂扁小朋友 - 横版动作闯关</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="gameContainer">
        <div id="startScreen" class="screen">
            <h1>狂扁小朋友</h1>
            <p class="subtitle">横版动作闯关</p>
            <div class="instructions">
                <h3>操作说明</h3>
                <p>← → 移动 | ↑ 跳跃</p>
                <p>J 出拳 | K 踢脚</p>
                <p>空格 必杀技</p>
            </div>
            <button id="startBtn">开始游戏</button>
        </div>
        
        <div id="gameScreen" class="screen hidden">
            <div id="hud">
                <div class="player-hud">
                    <span class="label">玩家</span>
                    <div class="health-bar">
                        <div id="playerHealth" class="health-fill"></div>
                    </div>
                    <span id="playerHealthText">100</span>
                </div>
                <div class="level-info">
                    <span>第 <span id="currentLevel">1</span> 关</span>
                    <span>分数: <span id="score">0</span></span>
                </div>
                <div class="enemy-hud">
                    <span class="label">敌人</span>
                    <span id="enemyCount">0</span>
                </div>
            </div>
            <div id="gameControls">
                <button id="homeBtn" class="control-btn">返回首页</button>
                <button id="restartGameBtn" class="control-btn">重新开始</button>
                <button id="pauseBtn" class="control-btn">暂停</button>
            </div>
            <div id="pauseOverlay" class="pause-overlay hidden">
                <div class="pause-content">
                    <h2>游戏暂停</h2>
                    <button id="resumeBtn" class="control-btn">继续游戏</button>
                </div>
            </div>
            <canvas id="gameCanvas"></canvas>
        </div>
        
        <div id="gameOverScreen" class="screen hidden">
            <h1>游戏结束</h1>
            <p>最终分数: <span id="finalScore">0</span></p>
            <p>到达关卡: <span id="finalLevel">1</span></p>
            <button id="restartBtn">重新开始</button>
        </div>
        
        <div id="victoryScreen" class="screen hidden">
            <h1>恭喜通关！</h1>
            <p>最终分数: <span id="victoryScore">0</span></p>
            <button id="playAgainBtn">再玩一次</button>
        </div>
    </div>
    
    <script src="js/constants.js"></script>
    <script src="js/input.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/entity.js"></script>
    <script src="js/player.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/level.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
