<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节奏之球 - Rhythm Ball</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <div class="ui-overlay">
            <div class="score-board">
                <div class="score-item">
                    <span class="label">分数</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">连击</span>
                    <span id="combo" class="value">0</span>
                </div>
            </div>
            <div id="start-screen" class="screen active">
                <h1>🎵 节奏之球 🎵</h1>
                <p>跟随音乐的节奏，点击屏幕让球跳跃</p>
                <p class="instruction">避开障碍物，尽可能走得更远！</p>
                <button id="start-btn" class="btn-primary">开始游戏</button>
                <div class="controls-hint">
                    <p>🖱️ 点击屏幕或按空格键跳跃</p>
                    <p>⏸️ 按 ESC 键暂停游戏</p>
                </div>
            </div>
            <div id="game-over-screen" class="screen">
                <h1>游戏结束</h1>
                <div class="final-score">
                    <p>最终得分: <span id="final-score">0</span></p>
                    <p>最高连击: <span id="max-combo">0</span></p>
                </div>
                <button id="restart-btn" class="btn-primary">再来一次</button>
            </div>
            <div id="pause-screen" class="screen">
                <h1>游戏暂停</h1>
                <button id="resume-btn" class="btn-primary">继续游戏</button>
                <button id="quit-btn" class="btn-secondary">退出游戏</button>
            </div>
        </div>
        <canvas id="game-canvas"></canvas>
    </div>
    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
