<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>贪吃蛇游戏</h1>
            <div class="game-info">
                <div class="score-board">
                    <span>分数:</span>
                    <span id="score">0</span>
                </div>
                <div class="high-score-board">
                    <span>最高分:</span>
                    <span id="highScore">0</span>
                </div>
            </div>
        </header>

        <div class="game-canvas-container">
            <canvas id="gameCanvas"></canvas>
            <div id="gameOverlay" class="game-overlay">
                <div class="overlay-content">
                    <h2 id="overlayTitle">准备开始</h2>
                    <p id="overlayMessage">按空格键开始游戏</p>
                </div>
            </div>
        </div>

        <div class="game-controls">
            <div class="control-buttons">
                <button id="startBtn" class="btn btn-primary">开始游戏</button>
                <button id="pauseBtn" class="btn btn-secondary" disabled>暂停</button>
                <button id="restartBtn" class="btn btn-warning" disabled>重新开始</button>
            </div>
            
            <div class="instructions">
                <h3>游戏规则</h3>
                <ul>
                    <li>使用方向键 ↑↓←→ 或 WASD 控制蛇的移动</li>
                    <li>吃到红色食物可以增加分数和蛇的长度</li>
                    <li>撞到墙壁或自己的身体游戏结束</li>
                    <li>游戏速度会随着分数增加而加快</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
